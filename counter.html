<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="トッポギ定食ゲームラボの訪問者カウンター">
  <title>訪問者カウンター | トッポギ定食ゲームラボ</title>
  <style>
    :root {
      --background: #f4f3ef;
      --surface: #ffffff;
      --text: #252525;
      --muted: #77766f;
      --accent: #c85b43;
      --border: #deddd6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Noto Sans JP", "Yu Gothic", sans-serif;
      line-height: 1.8;
    }

    header, main, footer {
      padding: 22px 6%;
    }

    header, footer {
      border-color: var(--border);
      border-style: solid;
    }

    header { border-width: 0 0 1px; }

    header a {
      color: inherit;
      text-decoration: none;
    }

    main {
      max-width: 760px;
      margin: 50px auto;
      text-align: center;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .counter-card {
      margin-top: 30px;
      padding: 35px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .counter-number {
      margin: 16px 0;
      font-size: clamp(28px, 7vw, 48px);
      font-weight: bold;
      color: var(--accent);
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 20px;
      background: var(--text);
      color: white;
      border-radius: 5px;
      text-decoration: none;
    }

    footer {
      border-width: 1px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html"><strong>トッポギ定食ゲームラボ</strong></a>
  </header>

  <main>
    <p class="eyebrow">VISITOR COUNTER</p>
    <h1>訪問者カウンター</h1>
    <p>サイトを見に来てくれてありがとうございます！</p>

    <section class="counter-card">
      <p>これまでの訪問数</p>
     <iframe
  src="https://toppogi.goatcounter.com/counter/TOTAL.html"
  title="サイト全体の訪問数"
  width="220"
  height="80"
  style="border: 0; max-width: 100%;"
></iframe>
      <p>また遊びに来てね。</p>
    </section>

    <a class="back-link" href="index.html">トップページへ戻る</a>
  </main>

  <footer>
    <p>© トッポギ定食ゲームラボ</p>
  </footer>

 <script
  data-goatcounter="https://toppogi.goatcounter.com/count"
  async
  src="https://gc.zgo.at/count.js">
</script>

<script>
  window.addEventListener("load", function () {
    if (
      window.goatcounter &&
      typeof window.goatcounter.visit_count === "function"
    ) {
     window.goatcounter.visit_count({
  path: "TOTAL",
  append: "#visits",
  no_cache: true
});
    }
  });
</script>
</body>
</html>
