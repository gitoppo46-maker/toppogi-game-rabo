
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="トッポギ定食ゲームラボの開発日記。ゲーム制作の進捗や活動を紹介します。">
  <title>開発日記 | トッポギ定食ゲームラボ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f6f2;
      color: #292929;
      font-family: sans-serif;
      line-height: 1.8;
    }

    header {
      padding: 20px;
      background: #fff;
      border-bottom: 1px solid #e5e2dc;
    }

    .header-inner {
      max-width: 800px;
      margin: 0 auto;
    }

    header a {
      color: #292929;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 30px;
    }

    .intro {
      color: #666;
      margin-bottom: 32px;
    }

    .diary-entry {
      margin-bottom: 20px;
      padding: 24px;
      background: #fff;
      border: 1px solid #e5e2dc;
      border-radius: 8px;
    }

    .diary-entry time {
      color: #777;
      font-size: 14px;
    }

    .diary-entry h2 {
      margin: 8px 0 12px;
      font-size: 21px;
    }

    .diary-entry p {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 20px;
      color: #666;
      background: #fff;
      border-radius: 8px;
    }

    footer {
      padding: 24px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      main {
        margin-top: 24px;
      }

      .diary-entry {
        padding: 18px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <a href="index.html">← トッポギ定食ゲームラボへ戻る</a>
    </div>
  </header>

  <main>
    <h1>開発日記</h1>
    <p class="intro">
      ゲーム制作の進捗や、サークルの活動を記録していきます。
    </p>

    <div id="diary-list">
      <p>日記を読み込んでいます...</p>
    </div>
  </main>

  <footer>
    © トッポギ定食ゲームラボ
  </footer>

  <script src="diary-data.js"></script>
  <script>
    const diaryList = document.getElementById("diary-list");

    if (typeof diaryEntries === "undefined" ||
        diaryEntries.length === 0) {
      diaryList.textContent = "まだ日記はありません。";
    } else {
      diaryList.replaceChildren();

      diaryEntries.forEach(function(entry) {
        const article = document.createElement("article");
        article.className = "diary-entry";

        const date = document.createElement("time");
        date.dateTime = entry.date;
        date.textContent = entry.date;

        const title = document.createElement("h2");
        title.textContent = entry.title;

        const body = document.createElement("p");
        body.textContent = entry.body;

        article.append(date, title, body);
        diaryList.appendChild(article);
      });
    }
  </script>
</body>
</html>
